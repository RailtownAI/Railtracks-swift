name: "Task"
description: "A well-scoped, unambiguous piece of work."
type: Task

body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Maintainer only.** This template is for maintainers filing scoped work items. Outside contributors: please use **Bug Report** for bugs, **Feature Request** for features, or [Discussions](https://github.com/RailtownAI/Railtracks-swift/discussions) for questions.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Agents / Nodes / Flow
        - Tools
        - LLM Providers (OpenAI / Anthropic / Gemini)
        - Apple Foundation Models (.appleAI / .foundationModel)
        - Structured Output
        - Guardrails
        - Knowledge Tool
        - RAG / Retrieval (RailtracksSwiftRAG)
        - SwiftUI views (RailtracksSwiftUI)
        - Observability / Flow-graph Trace / Instruments
        - Evaluations
        - Demo App
        - Build / Tooling / Repo
        - Cross-cutting / Multiple
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the change, in code terms? Include specific requirements as a bulleted list. Link the design doc if there is one.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done? Concrete checklist a reviewer can verify.
      placeholder: |
        - [ ] New API accepts X and returns Y
        - [ ] Unit tests cover the happy path and the error case (`swift test`)
        - [ ] OS-gated code stays behind `#available`, keeping the macOS 15 / iOS 18 floor
        - [ ] README / AGENTS.md updated if behavior or architecture changed
        - [ ] Verified in the demo app, if it has a UI
