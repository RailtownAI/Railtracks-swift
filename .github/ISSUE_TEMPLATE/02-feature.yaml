name: Feature Request
description: Propose a new feature or improvement for RailtracksSwift.
type: Feature

body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas and "have you thought about X" belong in [Discussions](https://github.com/RailtownAI/Railtracks-swift/discussions). Bugs in existing behavior belong in the **Bug Report** template.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which subsystem is this feature for? Pick the closest match.
      options:
        - Agents / Nodes / Flow
        - Tools
        - LLM Providers (OpenAI / Anthropic / Gemini)
        - Apple Foundation Models (.appleAI / .privateCloudCompute / .foundationModel)
        - Structured Output
        - Guardrails
        - Knowledge Tool
        - RAG / Retrieval (RailtracksSwiftRAG)
        - SwiftUI views (RailtracksSwiftUI)
        - Observability / Flow-graph Trace / Instruments
        - Evaluations
        - Demo App
        - Parity with Python railtracks
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that RailtracksSwift doesn't support today? Include the concrete use case.
      placeholder: I want to run guardrails on tool outputs before they reach the LLM, but the current guardrails only run on an agent's input and output.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? An API sketch, a reference to how the Python railtracks or another framework does it, or the shape of the behavior is fine.
      placeholder: Add an `RTSToolOutputGuardrail` protocol, attached via `RTSAgent(toolOutputGuardrails:)`, run on each tool result before it is returned to the model.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other ways RailtracksSwift could solve this.

  - type: textarea
    id: platform
    attributes:
      label: Platform constraints
      description: Optional. Does this need a particular OS or SDK (e.g. macOS / iOS 26 for `.appleAI`, 27 for `.privateCloudCompute` and `.foundationModel`), Apple Intelligence, or an entitlement? Anything that would affect the package's macOS 15 / iOS 18 floor?
